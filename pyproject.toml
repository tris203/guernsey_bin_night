[project]
name = "guernsey-bin-night"
version = "0.1.0"
description = "Guernsey bin collection sensors for Home Assistant"
requires-python = ">=3.13.2"

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component==0.13.316",
    "ruff==0.16.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers --disable-socket --allow-unix-socket"

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]
